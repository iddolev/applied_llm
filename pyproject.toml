[project]
name = "applied-llm"
version = "0.1.0"
description = "Question answering over a document corpus using RAG and hierarchical summaries"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "httpx>=0.27",
    "mwparserfromhell>=0.6.6",
    "python-dotenv>=1.2.4",
    "tqdm>=4.66",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/applied_llm"]
